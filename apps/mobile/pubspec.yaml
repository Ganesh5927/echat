name: echat_mobile
description: Minimal Flutter client for the eChat device identity foundation.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0
  cryptography: ^2.7.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  echat_identity:
    path: ../../packages/identity
  echat_messaging:
    path: ../../packages/messaging
  echat_protocol:
    path: ../../packages/protocol
  echat_storage:
    path: ../../packages/storage
  echat_transport:
    path: ../../packages/transport

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
