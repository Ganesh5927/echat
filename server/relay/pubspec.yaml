name: echat_relay
description: Minimal untrusted ciphertext relay foundation for eChat.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.7
  echat_transport:
    path: ../../packages/transport
  shelf: ^1.4.2

dev_dependencies:
  cryptography: ^2.7.1
  echat_identity:
    path: ../../packages/identity
  echat_messaging:
    path: ../../packages/messaging
  echat_protocol:
    path: ../../packages/protocol
  echat_storage:
    path: ../../packages/storage
  http: ^1.2.2
  test: ^1.25.0